<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">Frame face, mat and artwork are separate parts</title><desc id="desc">A front-view diagram labels the slim outer frame, wide inner mat and artwork opening. Frame depth projects out of the wall and is not visible in this frontal diagram.</desc><rect width="720" height="430" rx="18" fill="#f2f5f1"/><rect x="60" y="48" width="270" height="330" fill="#75563c"/><rect x="74" y="62" width="242" height="302" fill="#fffdf7"/><rect x="116" y="104" width="158" height="218" fill="#66826b"/><path d="M67 55H430M292 82H430M200 190H430" stroke="#182b30" stroke-width="2" fill="none"/><g font-family="Arial,sans-serif" fill="#182b30"><text x="447" y="60" font-size="22">Frame face</text><text x="447" y="92" font-size="17">Visible outer border</text><text x="447" y="139" font-size="22">Mat</text><text x="447" y="166" font-size="17">Space around the print</text><text x="447" y="220" font-size="22">Artwork opening</text><text x="447" y="247" font-size="17">Keep its proportions</text><text x="60" y="410" font-size="16">Illustrative front view. Frame depth is a separate measurement.</text></g><path d="M430 82v52M430 190v25" stroke="#182b30" stroke-width="2" fill="none"/></svg>
