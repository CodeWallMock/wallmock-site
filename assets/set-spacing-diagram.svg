<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-labelledby="title desc"><title id="title">The width of a trio includes two gaps</title><desc id="desc">Three equal framed pictures form a row. Each outer frame is 20 inches wide, and the two spaces between frames are 2 inches. The total group width is 64 inches.</desc><rect width="720" height="320" rx="18" fill="#f2f5f1"/><g stroke="#75563c" stroke-width="10"><rect x="50" y="45" width="180" height="170" fill="#66826b"/><rect x="270" y="45" width="180" height="170" fill="#c3ab87"/><rect x="490" y="45" width="180" height="170" fill="#809898"/></g><g font-family="Arial,sans-serif" text-anchor="middle" fill="#182b30" font-size="18"><text x="140" y="245">20 in</text><text x="250" y="245">2 in</text><text x="360" y="245">20 in</text><text x="470" y="245">2 in</text><text x="580" y="245">20 in</text><text x="360" y="290">Total group width: 64 inches · Illustrative, not a hanging rule</text></g></svg>
