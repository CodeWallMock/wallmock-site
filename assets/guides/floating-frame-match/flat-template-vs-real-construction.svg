<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" role="img" aria-labelledby="t d">
<title id="t">Flat template versus real floating-frame construction</title>
<desc id="d">Left: a flat template, where artwork is pasted into a fixed frame opening with no gap and one painted shadow. Right: a floating frame, drawn as a construction: the canvas sits inside an L-shaped frame with a recessed gap all round, a frame face, a frame side with depth and a soft shadow that follows the room light.</desc>
<defs>
<filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c9d3db"/><stop offset="1" stop-color="#8fa3b3"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a5a3a"/><stop offset="1" stop-color="#6e4329"/></linearGradient>
</defs>
<rect width="1200" height="620" fill="#f3f1ec"/>
<g font-family="Helvetica Neue, Helvetica, Arial, sans-serif" fill="#1c1d1e">
<text x="300" y="44" font-size="26" font-weight="700" text-anchor="middle">Flat template</text>
<text x="900" y="44" font-size="26" font-weight="700" text-anchor="middle">Real floating-frame construction</text>
<line x1="600" y1="20" x2="600" y2="600" stroke="#d6d2c8" stroke-width="2"/>
<!-- left front view -->
<rect x="150" y="80" width="300" height="220" fill="#e3ded3"/>
<rect x="196" y="112" width="216" height="160" fill="#5a5048" opacity=".55" transform="translate(10,10)"/>
<rect x="186" y="102" width="216" height="160" fill="#2b2b2b"/>
<rect x="198" y="114" width="192" height="136" fill="url(#art)"/>
<text x="300" y="330" font-size="17" text-anchor="middle" fill="#5f6368">Front: art pasted into a fixed opening</text>
<!-- left section -->
<text x="300" y="380" font-size="17" text-anchor="middle" fill="#5f6368">Side view</text>
<rect x="140" y="400" width="12" height="160" fill="#b9b3a6"/>
<rect x="152" y="420" width="10" height="120" fill="#2b2b2b"/>
<text x="180" y="455" font-size="16">One flat layer: no gap,</text>
<text x="180" y="477" font-size="16">no frame side, no depth.</text>
<text x="180" y="499" font-size="16">The frame colour, width and</text>
<text x="180" y="521" font-size="16">shadow are fixed in the photo.</text>
<!-- right front view -->
<rect x="750" y="80" width="300" height="220" fill="#e3ded3"/>
<rect x="788" y="104" width="230" height="174" fill="#6b6257" opacity=".5" filter="url(#soft)" transform="translate(9,9)"/>
<rect x="786" y="102" width="228" height="170" fill="url(#wood)"/>
<rect x="796" y="112" width="208" height="150" fill="#0f0d0c"/>
<rect x="804" y="120" width="192" height="134" fill="url(#art)"/>
<g font-size="15" font-weight="700"><circle cx="1000" cy="187" r="13" fill="#fff" stroke="#1c1d1e" stroke-width="2"/><text x="1000" y="192" text-anchor="middle">1</text>
<circle cx="1033" cy="108" r="13" fill="#fff" stroke="#1c1d1e" stroke-width="2"/><text x="1033" y="113" text-anchor="middle">2</text>
<circle cx="1050" cy="270" r="13" fill="#fff" stroke="#1c1d1e" stroke-width="2"/><text x="1050" y="275" text-anchor="middle">4</text></g>
<text x="900" y="330" font-size="17" text-anchor="middle" fill="#5f6368">Front: 1 gap, 2 frame face, 4 soft shadow</text>
<!-- right section -->
<text x="900" y="380" font-size="17" text-anchor="middle" fill="#5f6368">Side view (cross-section, top to bottom)</text>
<rect x="700" y="400" width="12" height="170" fill="#b9b3a6"/>
<text x="706" y="592" font-size="14" text-anchor="middle" fill="#5f6368">wall</text>
<!-- frame L profile: back rail against wall, side going out, face lip -->
<path d="M712 410 h96 v14 h-84 v22 h-12 z" fill="url(#wood)"/><path d="M712 574 h96 v-14 h-84 v-22 h-12 z" fill="url(#wood)"/>
<!-- canvas body recessed -->
<rect x="726" y="436" width="70" height="112" fill="#d8d2c4" stroke="#9c958c"/>
<rect x="796" y="436" width="4" height="112" fill="url(#art)"/>
<!-- gap -->
<rect x="726" y="424" width="70" height="12" fill="#0f0d0c"/>
<rect x="726" y="548" width="70" height="12" fill="#0f0d0c"/>
<g font-size="15" font-weight="700"><circle cx="760" cy="430" r="11" fill="#fff" stroke="#1c1d1e" stroke-width="2"/><text x="760" y="435" text-anchor="middle">1</text>
<circle cx="822" cy="417" r="11" fill="#fff" stroke="#1c1d1e" stroke-width="2"/><text x="822" y="422" text-anchor="middle">2</text>
<circle cx="836" cy="567" r="11" fill="#fff" stroke="#1c1d1e" stroke-width="2"/><text x="836" y="572" text-anchor="middle">3</text></g>
<text x="870" y="455" font-size="16">1 Gap: a recess between canvas</text>
<text x="870" y="477" font-size="16">and frame, dark inside.</text>
<text x="870" y="503" font-size="16">2 Face: the thin front of the frame.</text>
<text x="870" y="529" font-size="16">3 Side: frame depth off the wall.</text>
<text x="870" y="555" font-size="16">4 Shadow from that depth.</text>
<text x="760" y="498" font-size="13" text-anchor="middle" fill="#5f6368">canvas</text>
</g>
</svg>
